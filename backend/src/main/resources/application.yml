# yaml-language-server: $schema=https://json.schemastore.org/spring-boot-application-properties.json
spring:
  application:
    name: pizzamaker-api

  main:
    # Defer bean creation until first use — cuts dev startup from ~10 s to ~5 s.
    # Safe for this app because all endpoints are request-scoped.
    lazy-initialization: true

  datasource:
    url: jdbc:h2:mem:pizzadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    # common/ holds vendor-neutral migrations; {vendor} resolves to h2 or
    # postgresql at runtime so engine-specific syntax (e.g. partial indexes,
    # which H2 doesn't support) only applies where it's actually valid.
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}

  kafka:
    # Only ever contacted when app.kafka.enabled is true (see below).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

# Resilience around the notification call: retry transient failures a few times
# with backoff, and open a circuit breaker if the downstream is consistently down
# so we stop hammering it. The outbox provides the durable, longer-horizon retry;
# this handles fast transient blips inline.
resilience4j:
  retry:
    instances:
      notification:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      notification:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

app:
  jwt:
    # Dev fallback only — set JWT_SECRET in the environment for any real deployment.
    # Must decode to >= 32 bytes (Base64-encoded); generate with: openssl rand -base64 32
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItcGl6emEtbWFrZXItYXBwLTIwMjQ=}
    expiration-ms: 86400000
  # Shared secret for verifying inbound payment webhook signatures (HMAC-SHA256).
  webhook:
    secret: ${WEBHOOK_SECRET:whsec_dev_pizza_maker_local_secret}

  kafka:
    # OFF by default, and that is deliberate: `./mvnw test`, CI and a bare
    # `spring-boot:run` all work with no broker on the machine. With the flag off,
    # every @KafkaListener / producer bean is @ConditionalOnProperty'd out of
    # existence and the outbox relay dispatches in-process exactly as it did
    # before Kafka existed (InProcessOrderEventPublisher).
    #
    # Turn it on with `docker compose up` (the compose file sets KAFKA_ENABLED=true)
    # or KAFKA_ENABLED=true locally against a broker on :9092.
    enabled: ${KAFKA_ENABLED:false}

    # Shared group for the work listeners — competing consumers, each message
    # handled by exactly one pod. The WebSocket broadcast listener deliberately
    # does NOT use this; it generates a unique group per pod.
    work-group: pizzamaker-orders

    partitions: 3
    replicas: 1

    # Dwell time in each kitchen stage. Applied on a scheduler thread, never by
    # sleeping in the listener.
    stage-delay: 3s

    # Loop fuse for the self-perpetuating pipeline (3 real hops + headroom).
    max-hops: 4

    # How long to wait for the broker ack before failing the send and letting the
    # outbox retry the row.
    send-timeout: 10s

    topics:
      order-placed: orders.placed
      order-lifecycle: orders.lifecycle
      order-status-changed: orders.status-changed

server:
  port: ${PORT:8080}
