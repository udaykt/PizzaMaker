apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pizzamaker.fullname" . }}-secrets
  labels:
    {{- include "pizzamaker.labels" . | nindent 4 }}
type: Opaque

# stringData, so Helm doesn't need the values pre-base64'd — Kubernetes encodes
# them. Note that base64 is encoding, not encryption: this Secret is readable by
# anyone with get-secret rights in the namespace. See values.yaml on where these
# should really come from.
stringData:
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}