apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizzamaker.fullname" . }}
  labels:
    {{- include "pizzamaker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pizzamaker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

  # A WebSocket is a long-lived connection to ONE pod, and the STOMP broker is
  # in-memory per pod. Sticky sessions keep a given client on the pod it
  # handshook with, so the SockJS negotiation and the session that follows don't
  # get split across replicas.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800