# Render Blueprint — provisions the PizzaMaker backend only.
#
# The database now lives on NEON (neon.tech), not Render. Render's free Postgres
# is deleted after 90 days; Neon's free tier is free-forever (0.5 GB, autosuspend,
# ~1s wake). The backend reaches it via a single DATABASE_URL secret, so nothing
# here provisions or depends on a Render database.
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply.
# You'll be prompted for the `sync: false` secrets below (set them in the dashboard):
#   DATABASE_URL       -> your Neon JDBC URL (see README "Database on Neon")
#   DATABASE_USERNAME  -> Neon user
#   DATABASE_PASSWORD  -> Neon password
#   JWT_SECRET         -> openssl rand -base64 32
#   WEBHOOK_SECRET     -> any random string
services:
  - type: web
    name: pizzamaker-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Must match your Cloudflare Pages origin so the browser is allowed to call the API.
      - key: ALLOWED_ORIGINS
        value: https://pizzamaker.pages.dev

      # Neon database — set in the Render dashboard, never committed.
      # DATABASE_URL is a full JDBC URL, e.g.
      #   jdbc:postgresql://ep-xxx-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      # application-prod.yml already prefers DATABASE_URL when present.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # App secrets — also dashboard-set.
      - key: JWT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
