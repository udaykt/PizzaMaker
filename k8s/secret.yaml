apiVersion: v1
kind: Secret
metadata:
  name: pizzamaker-secrets
  labels:
    app: pizzamaker-api
type: Opaque

# DEMO VALUES ONLY — these exist so `kubectl apply -f k8s/` works out of the box
# on a local minikube. A Kubernetes Secret is base64, not encryption: anyone with
# read access to the namespace can decode it, and committing one to git means it
# is in your history forever.
#
# For anything real, these come from outside the repo — Sealed Secrets, the
# External Secrets Operator pointed at Vault/AWS Secrets Manager, or a CI-injected
# `kubectl create secret`. The Helm chart takes them as values for exactly this
# reason (see helm/pizzamaker/values.yaml).
stringData:
  DATABASE_PASSWORD: "pizzapass"

  # Must decode to >= 32 bytes. Generate a real one with: openssl rand -base64 32
  JWT_SECRET: "bXktc3VwZXItc2VjcmV0LWtleS1mb3ItcGl6emEtbWFrZXItYXBwLTIwMjQ="

  WEBHOOK_SECRET: "whsec_dev_pizza_maker_local_secret"