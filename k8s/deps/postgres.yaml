# Postgres for a local cluster only. Ephemeral (emptyDir), single replica, no
# backups — a real deployment uses a managed database (RDS/Cloud SQL/Neon) or an
# operator, not a bare Deployment. This exists so `helm install` has something to
# talk to on minikube.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pizzadb
            - name: POSTGRES_USER
              value: pizzauser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pizzamaker-secrets
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pizzauser", "-d", "pizzadb"]
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: pg